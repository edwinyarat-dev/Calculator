<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="calculator">
    <div class="calculator__header">
      <h1 class="calculator__title">Calculator</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <div class="display" aria-live="polite">
      <div class="display__expression" id="expression"></div>
      <div class="display__value" id="output">0</div>
    </div>

    <div class="keys">
      <button class="key key--function" data-action="clear">AC</button>
      <button class="key key--function" data-action="backspace">⌫</button>
      <button class="key key--function" data-action="percent">%</button>
      <button class="key key--operator" data-action="operator" data-operator="÷">÷</button>

      <button class="key key--digit" data-action="digit" data-digit="7">7</button>
      <button class="key key--digit" data-action="digit" data-digit="8">8</button>
      <button class="key key--digit" data-action="digit" data-digit="9">9</button>
      <button class="key key--operator" data-action="operator" data-operator="×">×</button>

      <button class="key key--digit" data-action="digit" data-digit="4">4</button>
      <button class="key key--digit" data-action="digit" data-digit="5">5</button>
      <button class="key key--digit" data-action="digit" data-digit="6">6</button>
      <button class="key key--operator" data-action="operator" data-operator="−">−</button>

      <button class="key key--digit" data-action="digit" data-digit="1">1</button>
      <button class="key key--digit" data-action="digit" data-digit="2">2</button>
      <button class="key key--digit" data-action="digit" data-digit="3">3</button>
      <button class="key key--operator" data-action="operator" data-operator="+">+</button>

      <button class="key key--digit key--zero" data-action="digit" data-digit="0">0</button>
      <button class="key key--digit" data-action="decimal">.</button>
      <button class="key key--equals" data-action="equals">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
